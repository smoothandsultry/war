<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>war join</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h2>Logged in as: <span id="user-name">Guest</span></h2>

        <div class="board-shell">
            <div id="board-top-labels" class="board-top-labels"></div>

            <div class="board-inner">
                <div id="board-side-labels" class="board-side-labels"></div>
                <div id="grid-board" class="grid-20"></div>
            </div>
        </div>

        <div class="status-panel">
            <h3>My Status</h3>
            <p>Hearts: <span id="stat-hearts">3</span>/3</p>
            <p>Action Points: <span id="stat-ap">0</span></p>
            <p>Range: <span id="stat-range">2</span></p>
        </div>

        <div class="action-panel">
            <h3>Actions</h3>
            <button onclick="selectAction('MOVE')">[1] Move</button>
            <button onclick="selectAction('SHOOT')">[1] Shoot</button>
            <button onclick="selectAction('GIFT')">[1] Gift</button>
            <button onclick="selectAction('UPGRADE')">[3] Upgrade</button>
            <p id="action-instruction">Select an action, then click a tile.</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
    <script>
        const socket = io();

        fetch('/user')
            .then(res => res.json())
            .then(data => {
                // Check what /user actually returned (could be an object with .username, or an ID string)
                console.log("Fetched user data:", data);
                
                const username = data.username || data.name || "smoothandsultry"; // Fallback or adjust based on your /user endpoint
                const discordId = data.id || data.discordId || data;

                document.getElementById('user-display').innerText = `Logged in as: ${username}`;
                
                // Emit player-join with the correct user details
                socket.emit('player-join', { 
                    name: username, 
                    discordId: discordId 
                });
            })
            .catch(err => {
                console.error("Failed to fetch user:", err);
            });

        // Listen for board state updates from the server
        socket.on('update-board', (data) => {
            // Get the current username from the display header
            const headerText = document.getElementById('user-display').innerText;
            const username = headerText.replace('Logged in as: ', '');
            
            const myTank = data.tanks.find(t => t.name === username);

            if (myTank) {
                document.getElementById('hearts').innerText = `Hearts: ${myTank.hearts}/3`;
                document.getElementById('ap').innerText = `Action Points: ${myTank.ap}`;
                document.getElementById('range').innerText = `Range: ${myTank.range}`;
            }
        });
    </script>
</body>
</html>
