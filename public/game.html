<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>war</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h2>Logged in as: <span id="user-name">Guest</span></h2>

        <div class="board-shell">
            <div id="board-top-labels" class="board-top-labels"></div>
            <div id="board-side-labels" class="board-side-labels"></div>

            <div class="board-inner">
                <div id="grid-board" class="grid-20"></div>
            </div>
        </div>

        <div class="command-panel">
            <div class="command-panel-header">
                <h3>Command Panel</h3>
                <span class="ap-badge">AP <span id="stat-ap">0</span></span>
            </div>

            <div class="status-grid">
                <div class="stat-card stat-health">
                    <span class="stat-label">Health</span>
                    <div id="stat-hearts" class="health-hearts" aria-label="Health">
                        <span>♥</span>
                        <span>♥</span>
                        <span>♥</span>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Range</span>
                    <strong id="stat-range">2</strong>
                </div>
            </div>

            <div class="action-grid">
                <button class="action-card selected" onclick="selectAction('MOVE')">
                    <div class="action-head">
                        <span>Move</span>
                        <span class="action-cost">1 AP</span>
                    </div>
                    <span class="action-desc">Move to an adjacent tile</span>
                </button>
                <button class="action-card" onclick="selectAction('SHOOT')">
                    <div class="action-head">
                        <span>Shoot</span>
                        <span class="action-cost">1 AP</span>
                    </div>
                    <span class="action-desc">Hit a target within range</span>
                </button>
                <button class="action-card" onclick="selectAction('GIFT')">
                    <div class="action-head">
                        <span>Gift</span>
                        <span class="action-cost">1 AP</span>
                    </div>
                    <span class="action-desc">Give a nearby target 1 AP</span>
                </button>
                <button class="action-card" onclick="selectAction('UPGRADE')">
                    <div class="action-head">
                        <span>Upgrade</span>
                        <span class="action-cost">3 AP</span>
                    </div>
                    <span class="action-desc">Increase your range by 1</span>
                </button>
            </div>

            <p id="action-instruction">Select an action, then click a tile.</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
    <script>
        let currentUsername = null;

        fetch('/user')
            .then(res => res.json())
            .then(userData => {
                playerName = typeof userData === 'object' ? (userData.username || userData.global_name || "smoothandsultry") : "smoothandsultry";
                const userId = typeof userData === 'object' ? userData.id : userData;

                const nameEl = document.getElementById("user-name");
                if (nameEl) nameEl.textContent = playerName;

                renderBoardRuler();
                
                socket.emit("player-join", { name: playerName, discordId: userId, color: playerColor });
            })
            .catch(err => console.error("Failed to fetch user profile:", err));

        // Listen for board updates and render your tank's stats
        socket.on('update-board', (data) => {
            if (!data.tanks) return;

            const myTank = data.tanks.find(t => t.name === playerName);
            if (myTank) {
                const heartsEl = document.getElementById('stat-hearts');
                if (heartsEl) {
                    heartsEl.innerHTML = '';
                    for (let i = 0; i < 3; i++) {
                        const heart = document.createElement('span');
                        heart.textContent = '♥';
                        heart.classList.toggle('is-empty', i >= (myTank.hearts || 0));
                        heartsEl.appendChild(heart);
                    }
                }
                document.getElementById('stat-ap').innerText = myTank.ap;
                document.getElementById('stat-range').innerText = myTank.range || 2;
            }
        });
    </script>
</body>
</html>
