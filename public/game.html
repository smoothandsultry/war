<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>war join</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h2>Logged in as: <span id="user-name">Guest</span></h2>

        <div class="board-shell">
            <div id="board-top-labels" class="board-top-labels"></div>

            <div class="board-inner">
                <div id="board-side-labels" class="board-side-labels"></div>
                <div id="grid-board" class="grid-20"></div>
            </div>
        </div>

        <div class="status-panel">
            <h3>My Status</h3>
            <p>Hearts: <span id="stat-hearts">3</span>/3</p>
            <p>Action Points: <span id="stat-ap">0</span></p>
            <p>Range: <span id="stat-range">2</span></p>
        </div>

        <div class="action-panel">
            <h3>Actions</h3>
            <button onclick="selectAction('MOVE')">[1] Move</button>
            <button onclick="selectAction('SHOOT')">[1] Shoot</button>
            <button onclick="selectAction('GIFT')">[1] Gift</button>
            <button onclick="selectAction('UPGRADE')">[3] Upgrade</button>
            <p id="action-instruction">Select an action, then click a tile.</p>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const socket = io();
        let currentUsername = null;

        // Fetch the logged-in user profile from Express/Passport
        fetch('/user')
            .then(res => res.json())
            .then(user => {
            const username = user.username || user.global_name;
            
            // Ensure this element actually updates on the page
            document.getElementById('user-display').innerText = `Logged in as: ${username}`;
            
            socket.emit('player-join', {
                name: username,
                discordId: user.id
            });
        });

        // Listen for board updates and render your tank's stats
        socket.on('update-board', (data) => {
            if (!currentUsername || !data.tanks) return;
            
            const myTank = data.tanks.find(t => t.name === currentUsername);
            if (myTank) {
                document.getElementById('hearts').innerText = `Hearts: ${myTank.hearts}/3`;
                document.getElementById('ap').innerText = `Action Points: ${myTank.ap}`;
                document.getElementById('range').innerText = `Range: ${myTank.range}`;
            }
        });
    </script>
</body>
</html>
